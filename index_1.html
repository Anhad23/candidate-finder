<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f2f4f3; --card:#ffffff; --ink:#15242b; --muted:#5b6b70; --line:#d5dddb;
  --btn:#0f5e63; --btn-ink:#ffffff; --mark:#fdf1d6; --field:#fbfcfc; --row:#f6f8f8; --err:#b23a3a;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1719; --card:#162125; --ink:#e3ecec; --muted:#93a5a8; --line:#2a3a3e;
  --btn:#4fb3b0; --btn-ink:#0b1416; --mark:#3a2f14; --field:#111b1e; --row:#1b282c; --err:#ef8080; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding:40px 16px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-size:clamp(28px,6vw,36px);margin:0;line-height:1.1}
h1 span{background:linear-gradient(transparent 60%,var(--mark) 60%)}
h2{font-family:var(--f-display);font-size:21px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
label{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,a:focus-visible,button:focus-visible{outline:2px solid var(--btn);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;text-align:center;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:15px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:16px;padding:11px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.hint,.status{font-size:14.5px;color:var(--muted);margin:0}
.status.err{color:var(--err)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--row);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--btn)}
tr:last-child td{border-bottom:0}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.count{font-weight:400;color:var(--muted);font-size:16px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Candidate <span>Finder</span></h1>

  <div class="card">
    <div><label for="role">Role <small>(separate with commas)</small></label>
      <input id="role" value="Marketing Manager, Marketing Executive, Digital Marketing"></div>
    <div class="two">
      <div><label for="loc">Location</label><input id="loc" value="Chennai"></div>
      <div><label for="ind">Industry</label><input id="ind" value="Real Estate"></div>
    </div>
    <div class="two">
      <div><label for="exmin">Experience from (yrs)</label><input id="exmin" type="number" min="0" max="40" value="4"></div>
      <div><label for="exmax">to (yrs)</label><input id="exmax" type="number" min="0" max="40" value="5"></div>
    </div>
    <div><label for="skills">Skills <small>(optional)</small></label><input id="skills" placeholder="e.g. Lead Generation, Google Ads"></div>
    <a class="btn" id="go" target="_blank" rel="noopener">Find candidates</a>
    <p class="hint" id="expHint"></p>
  </div>

  <div class="card">
    <h2>Save to Excel <span class="count" id="count"></span></h2>
    <div>
      <label for="paste">Paste results here</label>
      <textarea id="paste" placeholder="On the Google results page press Cmd+A, then Cmd+C, and paste here (Cmd+V). You can also paste a full LinkedIn profile to get years of experience."></textarea>
    </div>
    <button class="btn" id="readBtn">Add to list</button>
    <p class="status" id="status"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Job title</th><th>Current company</th><th>Location</th><th>Yrs at company</th><th>Total exp</th><th>LinkedIn</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row">
      <button class="btn" id="xlsBtn">Download Excel</button>
      <button class="btn ghost" id="clearBtn">Clear list</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Candidate Finder: turns pasted Google results or a LinkedIn profile into rows, with no AI.
(function(root){
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const clean=s=>String(s||"").replace(/\s*(\.\.\.|…)\s*$/,"").replace(/\s+/g," ").trim();
const looksLikeLocation=s=>/india|area|tamil nadu|karnataka|maharashtra|delhi|telangana|kerala|gujarat|uttar pradesh|haryana|,/i.test(s)&&!/\d{2,}/.test(s);
const fmt=m=>{if(m==null||m<0)return "";const y=Math.floor(m/12),mo=m%12;return [y?`${y} yr${y>1?"s":""}`:"",mo?`${mo} mo${mo>1?"s":""}`:""].filter(Boolean).join(" ")||"less than 1 mo";};
function monthIndex(s,now){
  if(/present/i.test(s)) return now.getFullYear()*12+now.getMonth();
  const m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{4})/); if(m&&MONTHS[m[1].toLowerCase()]!=null) return (+m[2])*12+MONTHS[m[1].toLowerCase()];
  const y=s.match(/(\d{4})/); return y?(+y[1])*12:null;
}

function linksFromHtml(html,domParser){
  const out=[]; const doc=domParser.parseFromString(html,"text/html");
  doc.querySelectorAll("a[href]").forEach(a=>{
    let h=a.getAttribute("href")||""; const m=h.match(/[?&](?:url|q)=([^&]+)/); if(m) try{h=decodeURIComponent(m[1]);}catch(e){}
    if(/linkedin\.com\/in\//.test(h)){ const url=h.split(/[?#]/)[0]; if(!out.some(o=>o.url===url)) out.push({text:a.textContent.replace(/\s+/g," ").trim(),url}); }
  });
  return out;
}
function findLink(name,links){
  const n=name.toLowerCase(); const toks=n.split(/\s+/).filter(t=>t.length>1);
  const hit=links.find(l=>l.text.toLowerCase().includes(n))||links.find(l=>toks.length&&toks.every(t=>l.url.toLowerCase().includes(t)));
  return hit?hit.url:"";
}

function parseGoogle(lines,links){
  const recs=[];
  for(let i=0;i<lines.length;i++){
    let name=null, start=i;
    const m=lines[i].match(/^LinkedIn\s*[·•]\s*(.+)$/i);
    if(m) name=clean(m[1]);
    else {
      const h=lines[i].match(/^(.+?)\s+[-–]\s+(.+?)(?:\s*\|\s*LinkedIn)?$/);
      const prevIsMarker=i>0&&/^LinkedIn\s*[·•]/i.test(lines[i-1]);
      if(h&&!prevIsMarker&&/\|\s*LinkedIn\s*$/i.test(lines[i])) name=clean(h[1]);
    }
    if(!name||name.split(" ").length>6) continue;
    const r={name,title:"",company:"",location:"",years_at_company:"",total_experience:"",linkedin:""};
    for(let j=start;j<Math.min(lines.length,start+7);j++){
      const L=lines[j];
      if(j>start&&/^LinkedIn\s*[·•]/i.test(L)) break;
      const h=L.match(/^(.+?)\s+[-–]\s+(.+)$/);
      if(h&&clean(h[1]).toLowerCase()===name.toLowerCase()){
        const rest=h[2].replace(/\s*\|\s*LinkedIn\s*$/i,"");
        const parts=rest.split(/\s+[-–]\s+/);
        if(!r.title) r.title=clean(parts[0].split(" | ")[0]);
        if(!r.company&&parts[1]) r.company=clean(parts[1].split(" | ")[0]);
        continue;
      }
      if(/[·•]/.test(L)&&!/^LinkedIn/i.test(L)&&!/followers|connections$/i.test(L.split(/[·•]/).pop()||"x")){
        const parts=L.split(/\s*[·•]\s*/).map(clean).filter(Boolean);
        const labeled={}; parts.forEach(p=>{const k=p.match(/^(Location|Experience|Education)\s*:\s*(.+)$/i); if(k) labeled[k[1].toLowerCase()]=k[2];});
        if(labeled.location||labeled.experience){
          if(labeled.location&&!r.location) r.location=clean(labeled.location);
          if(labeled.experience&&!r.company) r.company=clean(labeled.experience);
        } else if(parts.length>=2&&looksLikeLocation(parts[0])){
          if(!r.location) r.location=parts[0];
          if(parts[1]) r.title=parts[1];
          if(parts[2]) r.company=parts[2];
        }
      }
    }
    r.linkedin=findLink(name,links);
    if(!recs.some(x=>x.name.toLowerCase()===name.toLowerCase())) recs.push(r);
  }
  return recs;
}

function parseProfile(lines,links,now){
  const name=clean(lines[0]); if(!name||name.length>60) return [];
  const r={name,title:"",company:"",location:"",years_at_company:"",total_experience:"",linkedin:findLink(name,links)};
  const head=lines.slice(1,8);
  r.title=clean((head.find(l=>!looksLikeLocation(l)&&!/^\W*(he|she|they)\W*$/i.test(l)&&!/^\d/.test(l))||"").split(/\s*[|@]\s*/)[0]);
  r.location=clean(head.find(looksLikeLocation)||"");
  const ex=lines.findIndex(l=>/^experience$/i.test(l));
  const body=ex>=0?lines.slice(ex+1):lines;
  const dateRe=/^([A-Za-z]{3}[a-z]*\.?\s+\d{4}|\d{4})\s*[-–]\s*(Present|[A-Za-z]{3}[a-z]*\.?\s+\d{4}|\d{4})(?:\s*[·•]\s*(.+))?$/i;
  let firstIdx=-1, earliest=null;
  body.forEach((l,i)=>{const d=l.match(dateRe); if(d){ if(firstIdx<0) firstIdx=i; const s=monthIndex(d[1],now); if(s!=null&&(earliest==null||s<earliest)) earliest=s; }});
  if(firstIdx>=0){
    const d=body[firstIdx].match(dateRe);
    const s=monthIndex(d[1],now), e=monthIndex(d[2],now);
    // Grouped roles: "Company / Full-time · 3 yrs 2 mos / Title / dates"
    const grp=body.slice(Math.max(0,firstIdx-3),firstIdx).find(l=>/[·•]\s*\d+\s*yrs?|^\s*\d+\s*yrs?/i.test(l)&&!dateRe.test(l));
    if(grp){
      const gi=body.indexOf(grp);
      r.company=clean(body[gi-1]||""); r.title=clean(body[firstIdx-1]||r.title);
      r.years_at_company=clean(grp.split(/[·•]/).pop());
    } else {
      const compLine=body[firstIdx-1]||""; r.company=clean(compLine.split(/\s*[·•]\s*/)[0]);
      r.title=clean(body[firstIdx-2]||r.title);
      r.years_at_company=d[3]?clean(d[3]):(s!=null&&e!=null?fmt(e-s+1):"");
    }
    if(earliest!=null) r.total_experience="~"+fmt(now.getFullYear()*12+now.getMonth()-earliest+1);
  }
  return [r];
}

function parse(text,links,now){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  links=links||[]; now=now||new Date();
  const g=parseGoogle(lines,links);
  if(g.length) return g;
  return parseProfile(lines,links,now);
}
root.CF={parse,linksFromHtml};
})(typeof window!=="undefined"?window:globalThis);
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const FIELDS=["role","loc","ind","exmin","exmax","skills"];
const SYN={"real estate":["real estate","realty","property","developers","builders"],"it":["IT","software","technology"],
  "banking":["banking","bank","BFSI"],"bfsi":["BFSI","banking","NBFC","insurance"],"fmcg":["FMCG","consumer goods"],
  "healthcare":["healthcare","hospital","pharma"],"pharma":["pharma","pharmaceutical","life sciences"],
  "automobile":["automobile","automotive"],"education":["education","edtech"],"retail":["retail","e-commerce"],
  "manufacturing":["manufacturing","industrial"],"logistics":["logistics","supply chain"],"hospitality":["hospitality","hotel"]};
const list=s=>(s||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean);
const q=s=>/\s|-/.test(s)?`"${s}"`:s;
const or=a=>a.length?(a.length===1?q(a[0]):"("+a.map(q).join(" OR ")+")"):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function industryWords(s){const out=[];list(s).forEach(i=>(SYN[i.toLowerCase()]||[i]).forEach(w=>{if(!out.some(o=>o.toLowerCase()===w.toLowerCase()))out.push(w);}));return out;}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

function update(){
  const g=["site:linkedin.com/in",or(list($("role").value)),or(industryWords($("ind").value)),or(list($("loc").value)),or(list($("skills").value))].filter(Boolean).join(" ")+" -intern -jobs";
  $("go").href="https://www.google.com/search?q="+encodeURIComponent(g);
  const yr=new Date().getFullYear(), a=parseInt($("exmin").value), b=parseInt($("exmax").value);
  $("expHint").textContent=(!isNaN(a)&&!isNaN(b)&&b>=a)?`For ${a}–${b} years experience, pick people whose career started around ${yr-b}–${yr-a}.`:"";
  store.set("cf-v1",FIELDS.map(k=>$(k).value));
}
const saved=store.get("cf-v1",null); if(saved) FIELDS.forEach((k,i)=>{if(saved[i]!=null)$(k).value=saved[i];});
FIELDS.forEach(k=>$(k).addEventListener("input",update));
update();

let rows=store.get("cf-rows",[]);
function render(){
  $("count").textContent=rows.length?`(${rows.length})`:"";
  $("tbody").innerHTML=rows.length?rows.map((r,i)=>`<tr>
    <td>${esc(r.name)}</td><td>${esc(r.title)}</td><td>${esc(r.company)}</td><td>${esc(r.location)}</td>
    <td class="num">${esc(r.years_at_company)}</td><td class="num">${esc(r.total_experience)}</td>
    <td>${r.linkedin?`<a href="${esc(r.linkedin)}" target="_blank" rel="noopener">Profile</a>`:""}</td>
    <td><button class="x" data-i="${i}" aria-label="Remove">×</button></td></tr>`).join("")
    :`<tr><td colspan="8" class="empty">No candidates yet. Paste a Google results page above and press Add to list.</td></tr>`;
  $("tbody").querySelectorAll(".x").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.i,1);store.set("cf-rows",rows);render();});
}
render();

let links=[];
$("paste").addEventListener("paste",e=>{
  const html=e.clipboardData&&e.clipboardData.getData("text/html");
  if(html) links=CF.linksFromHtml(html, new DOMParser());
});

const st=$("status"); const say=(t,err)=>{st.textContent=t;st.className="status"+(err?" err":"");};
$("readBtn").onclick=()=>{
  const text=$("paste").value.trim();
  if(!text){say("Paste a Google results page or a LinkedIn profile first.",true);return;}
  const found=CF.parse(text, links, new Date());
  if(!found.length){say("No candidates found in that text. Copy the whole Google results page (Cmd+A, Cmd+C) and paste again.",true);return;}
  let added=0,updated=0;
  found.forEach(r=>{
    const ex=rows.find(x=>x.name.toLowerCase()===r.name.toLowerCase());
    if(ex){Object.keys(r).forEach(k=>{if(r[k])ex[k]=r[k];});updated++;} else {rows.push(r);added++;}
  });
  store.set("cf-rows",rows); render(); $("paste").value=""; links=[];
  say(`${added} added${updated?`, ${updated} updated`:""}. Check the rows, as some details can be cut short in Google results.`);
};

$("clearBtn").onclick=()=>{
  const b=$("clearBtn");
  if(b.dataset.armed){rows=[];store.set("cf-rows",rows);render();delete b.dataset.armed;b.textContent="Clear list";say("List cleared.");return;}
  b.dataset.armed="1";b.textContent="Press again to clear";setTimeout(()=>{delete b.dataset.armed;b.textContent="Clear list";},4000);
};

$("xlsBtn").onclick=()=>{
  if(!rows.length){say("Add some candidates first.",true);return;}
  if(!window.XLSX){say("The Excel maker didn't load. Check the internet connection and refresh.",true);return;}
  const data=[["Name","Job Title","Current Company","Location","Years at Company","Total Experience","LinkedIn"],
    ...rows.map(r=>[r.name,r.title,r.company,r.location,r.years_at_company,r.total_experience,r.linkedin])];
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws["!cols"]=[{wch:24},{wch:28},{wch:28},{wch:22},{wch:16},{wch:16},{wch:44}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Candidates");
  const name=["Candidates",list($("role").value)[0],list($("loc").value)[0]].filter(Boolean).join(" - ")+".xlsx";
  XLSX.writeFile(wb,name); say("Excel file downloaded.");
};
})();
</script>
</body>
</html>
